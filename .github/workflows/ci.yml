name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # go-version-file keeps the toolchain in lockstep with go.mod,
      # so changing the Go version means editing go.mod and nothing else.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify toolchain matches go.mod
        run: make verify-go

      - name: Test
        run: make test-race

      - name: Coverage
        run: make test-coverage

  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Check module tidiness
        run: |
          make deps
          git diff --exit-code go.mod go.sum \
            || (echo "go.mod/go.sum are out of sync — run 'make deps'" && exit 1)

      - name: Build all platforms
        run: make build-all

      - name: Smoke test
        run: |
          make build
          ./bin/gvm --version
          ./bin/gvm --help
          ./bin/gvm doctor || true

  installer:
    name: Installer script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Shell syntax and lint
        run: |
          bash -n scripts/install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/install.sh

      - name: Install from a locally built release
        run: |
          make release
          export GVM_BASE_URL="file://$PWD/dist/releases"
          export GVM_VERSION="$(git describe --tags --always --dirty)"
          bash scripts/install.sh
          "$HOME/.local/bin/gvm" --version

      - name: End-to-end version switch
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gvm configure
          gvm use 1.23
          gvm use 1.24
          "$HOME/.local/share/gvm/bin/go" version | grep -q 'go1.24'
          gvm list
          test -x /usr/local/go/bin/go && echo "system Go left untouched"
