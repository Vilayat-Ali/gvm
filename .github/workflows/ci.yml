name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # go-version-file keeps the toolchain in lockstep with go.mod,
      # so changing the Go version means editing go.mod and nothing else.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify toolchain matches go.mod
        run: make verify-go

      - name: Test
        run: make test-race

      - name: Coverage
        run: make test-coverage

  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # .golangci.yml uses the v2 config schema, which needs
      # golangci-lint-action v8 or newer (v6 installs golangci-lint v1.x).
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --timeout=5m

      - name: Check module tidiness
        run: |
          make deps
          git diff --exit-code go.mod go.sum \
            || (echo "go.mod/go.sum are out of sync — run 'make deps'" && exit 1)

      - name: Build all platforms
        run: make build-all

      - name: Smoke test
        run: |
          make build
          ./bin/gvm --version
          ./bin/gvm --help
          ./bin/gvm doctor || true

  installer:
    name: Installer script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Shell syntax and lint
        run: |
          bash -n scripts/install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/install.sh

      - name: Install from a locally built release
        run: |
          make release
          export GVM_BASE_URL="file://$PWD/dist/releases"
          export GVM_VERSION="$(git describe --tags --always --dirty)"
          bash scripts/install.sh
          "$HOME/.local/bin/gvm" --version

      - name: Record the state of system directories
        run: |
          for dir in /usr/local/go /usr/local/bin /usr/bin; do
            if [ -e "$dir" ]; then
              find "$dir" -maxdepth 1 -printf '%p %s %m\n' | sort
            else
              echo "$dir absent"
            fi
          done > "$RUNNER_TEMP/system-before.txt"
          wc -l < "$RUNNER_TEMP/system-before.txt"

      - name: End-to-end version switch
        run: |
          set -x
          export PATH="$HOME/.local/bin:$PATH"
          shim="$HOME/.local/share/gvm/bin"

          gvm configure
          gvm use 1.23
          "$shim/go" version | grep -q 'go1.23'

          gvm use 1.24
          "$shim/go" version | grep -q 'go1.24'

          # `list` writes versions to stdout and narration to stderr.
          gvm list 2>/dev/null | grep -q '1.24'
          case "$(gvm list --current 2>/dev/null)" in 1.24.*) ;; *) exit 1;; esac

          gvm remove 1.23 --purge
          PATH="$shim:$PATH" gvm doctor

      - name: Verify no system directory was modified
        run: |
          for dir in /usr/local/go /usr/local/bin /usr/bin; do
            if [ -e "$dir" ]; then
              find "$dir" -maxdepth 1 -printf '%p %s %m\n' | sort
            else
              echo "$dir absent"
            fi
          done > "$RUNNER_TEMP/system-after.txt"
          if ! diff -u "$RUNNER_TEMP/system-before.txt" "$RUNNER_TEMP/system-after.txt"; then
            echo "gvm modified a system directory"
            exit 1
          fi
          echo "system directories untouched"
